[project]
name = "online-store"
version = "0.1.0"
description = ""
authors = [
    { name = "Leshukova Elena", email = "e-redina@ya.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "pytest (>=9.0.2,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line-length = 119
exclude = '''.git'''

[tool.isort]
# максимальная длина строки
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'
